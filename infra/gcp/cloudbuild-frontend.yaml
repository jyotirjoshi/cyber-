steps:
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file=docker/frontend.Dockerfile
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=
      - --build-arg=NEXT_PUBLIC_WS_BASE_URL=wss://cynux-api-$PROJECT_NUMBER.asia-south1.run.app
      - --tag=asia-south1-docker.pkg.dev/$PROJECT_ID/cynux/frontend:${_IMAGE_TAG}
      - .

substitutions:
  _IMAGE_TAG: manual

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/cynux/frontend:${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
