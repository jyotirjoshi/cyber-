[phases.setup]
nixPkgs = [
  "python312",
  "python312Packages.pip",
  "libpango",
  "pango",
  "harfbuzz",
  "fontconfig",
  "cairo",
  "gdk-pixbuf",
  "libffi",
  "dejavu_fonts",
]

[phases.install]
cmds = ["pip install -e backend/"]

[start]
cmd = "python -m alembic -c backend/alembic.ini upgrade head && python -m uvicorn --factory app.api.app:create_app --host 0.0.0.0 --port $PORT --workers 2 --app-dir backend"
