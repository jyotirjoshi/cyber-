services:
  # ======================================================================
  # Cynux FastAPI Web Service (Native Python 3.12 - No Docker)
  # ======================================================================
  - type: web
    name: cynux-api
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn --factory app.api.app:create_app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /healthz
    preDeployCommand: cd backend && alembic upgrade head
    envVars:
      - key: CYNUX_ENVIRONMENT
        value: production
      - key: CYNUX_DEBUG
        value: "false"
      - key: CYNUX_API_PREFIX
        value: /api/v1
      - key: CYNUX_PUBLIC_BASE_URL
        value: https://cynux-api.onrender.com
      - key: CYNUX_ALLOWED_HOSTS
        value: .onrender.com,cynux-api.onrender.com,localhost
      - key: CYNUX_CORS_ORIGINS
        value: https://cyber-rho-bice.vercel.app,http://localhost:3000
      - key: CYNUX_DB__HOST
        fromDatabase:
          name: cynux-db
          property: host
      - key: CYNUX_DB__PORT
        fromDatabase:
          name: cynux-db
          property: port
      - key: CYNUX_DB__NAME
        fromDatabase:
          name: cynux-db
          property: database
      - key: CYNUX_DB__USER
        fromDatabase:
          name: cynux-db
          property: user
      - key: CYNUX_DB__PASSWORD
        fromDatabase:
          name: cynux-db
          property: password
      - key: CYNUX_REDIS__URL
        fromService:
          type: redis
          name: cynux-redis
          property: connectionString
      - key: CYNUX_SECURITY__JWT_SECRET
        generateValue: true
      - key: CYNUX_SECURITY__CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: CYNUX_LLM__PROVIDER
        value: openai
      - key: CYNUX_LLM__DEFAULT_MODEL
        value: gpt-4o
      - key: CYNUX_LLM__OPENAI_API_KEY
        sync: false

  # ======================================================================
  # Cynux Redis Service
  # ======================================================================
  - type: redis
    name: cynux-redis
    plan: free
    ipAllowList: []

databases:
  - name: cynux-db
    databaseName: cynux
    user: cynux
    plan: free
