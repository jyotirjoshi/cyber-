# Cynux — full local/self-hosted stack.
#
# Bring-up order is enforced with depends_on conditions:
#   postgres/redis healthy -> migrate (alembic upgrade head) completes ->
#   api + worker start. minio-init creates the artifact bucket and gates the worker.
#
# Networks (SEC-004): app + data services share `cynux_net`. Scanner containers
# the worker spawns join `cynux_scanner_net`, which no data service is attached to,
# so a compromised scanner image cannot reach postgres/redis/minio. The scanner
# network still has egress (it must reach the target being assessed).
#
# DefectDojo (FR-016) is the worker's vuln-management source of truth and is
# fatal-without. Run the bundled stack with `--profile defectdojo` (or `make
# up-defectdojo`) then `make defectdojo-token`, or point CYNUX_DEFECTDOJO__* at
# an external instance.

# --- shared backend image (api, worker, migrate all run it) ----------------
x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  image: cynux-backend:local
  env_file: [.env]
  networks: [cynux_net]
  restart: unless-stopped

# --- shared DefectDojo Django env (profile: defectdojo) --------------------
x-defectdojo-env: &defectdojo-env
  DD_DEBUG: "False"
  DD_ALLOWED_HOSTS: "*"
  DD_DATABASE_ENGINE: django.db.backends.postgresql
  DD_DATABASE_HOST: defectdojo-postgres
  DD_DATABASE_PORT: "5432"
  DD_DATABASE_NAME: defectdojo
  DD_DATABASE_USER: defectdojo
  DD_DATABASE_PASSWORD: ${DEFECTDOJO_DB_PASSWORD:?set DEFECTDOJO_DB_PASSWORD in .env}
  DD_CELERY_BROKER_URL: redis://defectdojo-redis:6379/0
  DD_SECRET_KEY: ${DEFECTDOJO_SECRET_KEY:?set DEFECTDOJO_SECRET_KEY in .env}
  DD_CREDENTIAL_AES_256_KEY: ${DEFECTDOJO_CREDENTIAL_AES_256_KEY:?set DEFECTDOJO_CREDENTIAL_AES_256_KEY in .env}

services:
  # ======================================================================
  # Data plane
  # ======================================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CYNUX_DB__USER:-cynux}
      POSTGRES_PASSWORD: ${CYNUX_DB__PASSWORD:?set CYNUX_DB__PASSWORD in .env}
      POSTGRES_DB: ${CYNUX_DB__NAME:-cynux}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [cynux_net]
    ports:
      - "${CYNUX_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CYNUX_DB__USER:-cynux} -d ${CYNUX_DB__NAME:-cynux}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [cynux_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CYNUX_STORAGE__ACCESS_KEY_ID:-cynux-minio}
      MINIO_ROOT_PASSWORD: ${CYNUX_STORAGE__SECRET_ACCESS_KEY:?set CYNUX_STORAGE__SECRET_ACCESS_KEY in .env}
    volumes:
      - minio_data:/data
    networks: [cynux_net]
    ports:
      - "${CYNUX_MINIO_API_PORT:-9000}:9000"
      - "${CYNUX_MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

  # One-shot: waits for MinIO, then creates the artifact bucket. Gates the worker.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    networks: [cynux_net]
    environment:
      MC_ACCESS: ${CYNUX_STORAGE__ACCESS_KEY_ID:-cynux-minio}
      MC_SECRET: ${CYNUX_STORAGE__SECRET_ACCESS_KEY:?set CYNUX_STORAGE__SECRET_ACCESS_KEY in .env}
      MC_BUCKET: ${CYNUX_STORAGE__BUCKET:-cynux-artifacts}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        until mc alias set cynux http://minio:9000 "$${MC_ACCESS}" "$${MC_SECRET}"; do
          echo "waiting for minio..."; sleep 2;
        done
        mc mb --ignore-existing "cynux/$${MC_BUCKET}"
        echo "cynux artifact bucket ready: $${MC_BUCKET}"
    restart: "no"

  # ======================================================================
  # Cynux backend (one image, three roles)
  # ======================================================================
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command:
      ["uvicorn", "--factory", "app.api.app:create_app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${CYNUX_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://localhost:8000/healthz", timeout=4).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    # The worker asks the host Docker daemon to launch scanner containers, so it
    # needs the socket. Running as root is the simple path; the hardened path is a
    # socket proxy (set CYNUX_SCANNER__DOCKER_HOST=tcp://docker-proxy:2375) and
    # dropping this override.
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Host path == in-container path on purpose: the worker hands this path to
      # the host daemon as a bind source for sibling scanner containers, and a
      # bind source is always resolved on the host.
      - ${CYNUX_ARTIFACT_HOST_DIR:-/var/lib/cynux/artifacts}:${CYNUX_ARTIFACT_HOST_DIR:-/var/lib/cynux/artifacts}

  # ======================================================================
  # Frontend (Next.js) — builds once frontend/ is populated.
  # ======================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8000}
    image: cynux-frontend:local
    env_file: [.env]
    depends_on:
      api:
        condition: service_started
    networks: [cynux_net]
    ports:
      - "${CYNUX_FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

  # ======================================================================
  # DefectDojo (compose profile: defectdojo) — the vuln-management truth.
  # ======================================================================
  defectdojo-postgres:
    image: postgres:16-alpine
    profiles: [defectdojo]
    environment:
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: ${DEFECTDOJO_DB_PASSWORD:?set DEFECTDOJO_DB_PASSWORD in .env}
      POSTGRES_DB: defectdojo
    volumes:
      - defectdojo_postgres_data:/var/lib/postgresql/data
    networks: [cynux_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defectdojo -d defectdojo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  defectdojo-redis:
    image: redis:7-alpine
    profiles: [defectdojo]
    networks: [cynux_net]
    restart: unless-stopped

  # Runs DB migrations and creates the admin user, then exits.
  defectdojo-initializer:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-latest}
    profiles: [defectdojo]
    entrypoint: ["/entrypoint-initializer.sh"]
    environment:
      <<: *defectdojo-env
      DD_INITIALIZE: "true"
      DD_ADMIN_USER: ${DEFECTDOJO_ADMIN_USER:-admin}
      DD_ADMIN_PASSWORD: ${DEFECTDOJO_ADMIN_PASSWORD:?set DEFECTDOJO_ADMIN_PASSWORD in .env}
      DD_ADMIN_MAIL: ${DEFECTDOJO_ADMIN_MAIL:-admin@cynux.local}
      DD_ADMIN_FIRST_NAME: Cynux
      DD_ADMIN_LAST_NAME: Admin
    depends_on:
      defectdojo-postgres:
        condition: service_healthy
      defectdojo-redis:
        condition: service_started
    networks: [cynux_net]
    restart: "no"

  defectdojo-uwsgi:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-latest}
    profiles: [defectdojo]
    entrypoint: ["/entrypoint-uwsgi.sh"]
    environment:
      <<: *defectdojo-env
    volumes:
      - defectdojo_media:/app/media
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
    networks: [cynux_net]
    restart: unless-stopped

  defectdojo-celeryworker:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-latest}
    profiles: [defectdojo]
    entrypoint: ["/entrypoint-celery-worker.sh"]
    environment:
      <<: *defectdojo-env
    volumes:
      - defectdojo_media:/app/media
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
    networks: [cynux_net]
    restart: unless-stopped

  defectdojo-celerybeat:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-latest}
    profiles: [defectdojo]
    entrypoint: ["/entrypoint-celery-beat.sh"]
    environment:
      <<: *defectdojo-env
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
    networks: [cynux_net]
    restart: unless-stopped

  defectdojo-nginx:
    image: defectdojo/defectdojo-nginx:${DEFECTDOJO_VERSION:-latest}
    profiles: [defectdojo]
    environment:
      DD_UWSGI_HOST: defectdojo-uwsgi
      DD_UWSGI_PORT: "3031"
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media
    depends_on:
      defectdojo-uwsgi:
        condition: service_started
    networks: [cynux_net]
    ports:
      - "${DEFECTDOJO_PORT:-8080}:8080"
    restart: unless-stopped

networks:
  cynux_net:
    driver: bridge
  # Egress-only network for scanner containers. Declared here so it exists with
  # this exact name (CYNUX_SCANNER__NETWORK) before the worker launches a scanner.
  # No data service is attached to it (SEC-004).
  cynux_scanner_net:
    name: cynux_scanner_net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  defectdojo_postgres_data:
  defectdojo_media:
