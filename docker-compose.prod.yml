# Cynux — Production Docker Compose Manifest
#
# Usage:
#   docker compose -f docker-compose.prod.yml --profile defectdojo up -d --build
#

x-backend-prod: &backend-prod
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  image: cynux-backend:production
  env_file: [.env]
  networks: [cynux_net]
  restart: always

x-defectdojo-env-prod: &defectdojo-env-prod
  DD_DEBUG: "False"
  DD_ALLOWED_HOSTS: "*"
  DD_DATABASE_ENGINE: django.db.backends.postgresql
  DD_DATABASE_HOST: defectdojo-postgres
  DD_DATABASE_PORT: "5432"
  DD_DATABASE_NAME: defectdojo
  DD_DATABASE_USER: defectdojo
  DD_DATABASE_PASSWORD: ${DEFECTDOJO_DB_PASSWORD:?set DEFECTDOJO_DB_PASSWORD in .env}
  DD_CELERY_BROKER_URL: redis://defectdojo-redis:6379/0
  DD_SECRET_KEY: ${DEFECTDOJO_SECRET_KEY:?set DEFECTDOJO_SECRET_KEY in .env}
  DD_CREDENTIAL_AES_256_KEY: ${DEFECTDOJO_CREDENTIAL_AES_256_KEY:?set DEFECTDOJO_CREDENTIAL_AES_256_KEY in .env}

services:
  # ======================================================================
  # Production Reverse Proxy (Auto TLS / SSL)
  # ======================================================================
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [cynux_net]
    depends_on:
      - frontend
      - api

  # ======================================================================
  # Data plane
  # ======================================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CYNUX_DB__USER:-cynux}
      POSTGRES_PASSWORD: ${CYNUX_DB__PASSWORD:?set CYNUX_DB__PASSWORD in .env}
      POSTGRES_DB: ${CYNUX_DB__NAME:-cynux}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks: [cynux_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CYNUX_DB__USER:-cynux} -d ${CYNUX_DB__NAME:-cynux}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    networks: [cynux_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CYNUX_STORAGE__ACCESS_KEY_ID:-cynux-minio}
      MINIO_ROOT_PASSWORD: ${CYNUX_STORAGE__SECRET_ACCESS_KEY:?set CYNUX_STORAGE__SECRET_ACCESS_KEY in .env}
    volumes:
      - minio_prod_data:/data
    networks: [cynux_net]
    restart: always

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    networks: [cynux_net]
    environment:
      MC_ACCESS: ${CYNUX_STORAGE__ACCESS_KEY_ID:-cynux-minio}
      MC_SECRET: ${CYNUX_STORAGE__SECRET_ACCESS_KEY:?set CYNUX_STORAGE__SECRET_ACCESS_KEY in .env}
      MC_BUCKET: ${CYNUX_STORAGE__BUCKET:-cynux-artifacts}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        until mc alias set cynux http://minio:9000 "$${MC_ACCESS}" "$${MC_SECRET}"; do
          echo "waiting for minio..."; sleep 2;
        done
        mc mb --ignore-existing "cynux/$${MC_BUCKET}"
        echo "cynux artifact bucket ready: $${MC_BUCKET}"
    restart: "no"

  # ======================================================================
  # Cynux backend (api, migrate, worker)
  # ======================================================================
  migrate:
    <<: *backend-prod
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-prod
    command:
      ["uvicorn", "--factory", "app.api.app:create_app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://localhost:8000/healthz", timeout=4).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend-prod
    command: ["python", "-m", "app.worker"]
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CYNUX_ARTIFACT_HOST_DIR:-/var/lib/cynux/artifacts}:${CYNUX_ARTIFACT_HOST_DIR:-/var/lib/cynux/artifacts}

  # ======================================================================
  # Frontend (Next.js)
  # ======================================================================
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_BASE_URL: ${NEXT_PUBLIC_WS_BASE_URL:-ws://localhost:8000}
    image: cynux-frontend:production
    env_file: [.env]
    depends_on:
      api:
        condition: service_started
    networks: [cynux_net]
    restart: always

  # ======================================================================
  # DefectDojo Vulnerability Management
  # ======================================================================
  defectdojo-postgres:
    image: postgres:16-alpine
    profiles: [defectdojo]
    environment:
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: ${DEFECTDOJO_DB_PASSWORD:?set DEFECTDOJO_DB_PASSWORD in .env}
      POSTGRES_DB: defectdojo
    volumes:
      - defectdojo_postgres_prod_data:/var/lib/postgresql/data
    networks: [cynux_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defectdojo -d defectdojo"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  defectdojo-redis:
    image: redis:7-alpine
    profiles: [defectdojo]
    networks: [cynux_net]
    restart: always

  defectdojo-initializer:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-latest}
    profiles: [defectdojo]
    entrypoint: ["/entrypoint-initializer.sh"]
    environment:
      <<: *defectdojo-env-prod
      DD_INITIALIZE: "true"
      DD_ADMIN_USER: ${DEFECTDOJO_ADMIN_USER:-admin}
      DD_ADMIN_PASSWORD: ${DEFECTDOJO_ADMIN_PASSWORD:?set DEFECTDOJO_ADMIN_PASSWORD in .env}
      DD_ADMIN_MAIL: ${DEFECTDOJO_ADMIN_MAIL:-admin@cynux.local}
      DD_ADMIN_FIRST_NAME: Cynux
      DD_ADMIN_LAST_NAME: Admin
    depends_on:
      defectdojo-postgres:
        condition: service_healthy
      defectdojo-redis:
        condition: service_started
    networks: [cynux_net]
    restart: "no"

  defectdojo-uwsgi:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-latest}
    profiles: [defectdojo]
    entrypoint: ["/entrypoint-uwsgi.sh"]
    environment:
      <<: *defectdojo-env-prod
    volumes:
      - defectdojo_media_prod:/app/media
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
    networks: [cynux_net]
    restart: always

  defectdojo-celeryworker:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-latest}
    profiles: [defectdojo]
    entrypoint: ["/entrypoint-celery-worker.sh"]
    environment:
      <<: *defectdojo-env-prod
    volumes:
      - defectdojo_media_prod:/app/media
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
    networks: [cynux_net]
    restart: always

  defectdojo-celerybeat:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-latest}
    profiles: [defectdojo]
    entrypoint: ["/entrypoint-celery-beat.sh"]
    environment:
      <<: *defectdojo-env-prod
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
    networks: [cynux_net]
    restart: always

  defectdojo-nginx:
    image: defectdojo/defectdojo-nginx:${DEFECTDOJO_VERSION:-latest}
    profiles: [defectdojo]
    environment:
      DD_UWSGI_HOST: defectdojo-uwsgi
      DD_UWSGI_PORT: "3031"
    volumes:
      - defectdojo_media_prod:/usr/share/nginx/html/media
    depends_on:
      defectdojo-uwsgi:
        condition: service_started
    networks: [cynux_net]
    restart: always

networks:
  cynux_net:
    driver: bridge
  cynux_scanner_net:
    name: cynux_scanner_net
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
  defectdojo_postgres_prod_data:
  defectdojo_media_prod:
